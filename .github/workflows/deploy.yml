# Calls the shared static deploy workflow. This job does not run in Clain-Apps/App-Template.
# @main follows edits on App-Framework's default branch.
# The stable pin in the consumer contract is deploy-static-v1. That tag is not on GitHub yet.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: Repoint current at the previous release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'Clain-Apps/App-Template'
    permissions:
      contents: read
    uses: Clain-Apps/App-Framework/.github/workflows/deploy-static.yml@main
    with:
      rollback: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
      node_version_file: .nvmrc
      install_command: pnpm install --frozen-lockfile
      build_command: pnpm check
      output_directory: out
      entry_file: index.html
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
